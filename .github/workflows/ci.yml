name: Bridge CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: pwsh

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  check:
    name: Check and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          [Console]::InputEncoding = [Text.UTF8Encoding]::new()
          npm ci
      - name: Typecheck, lint, test, build and verify release package
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          [Console]::InputEncoding = [Text.UTF8Encoding]::new()
          npm run check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-package-${{ github.sha }}
          path: |
            dist/bridge-*.zip
            dist/bridge-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Loader update
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bridge-package-${{ github.sha }}
          path: dist
      - name: Publish the tested ZIP and checksum together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          [Console]::InputEncoding = [Text.UTF8Encoding]::new()
          $version = $env:RELEASE_TAG.Substring(1)
          $notes = 'Background App Chat planning with per-task controls, autosaved settings, bounded waiting, owned-session cleanup and tolerant structured replies. One ZIP includes renderer and bridge-chat skill. Validated: GPT-5.6 Sol Medium -> Luna, three research rounds with actual tools and final delivery. Coding, Spark and Pro combinations are not fully accepted. Requires native Windows Loader 0.5.11 or later with schema-v2 bundled skills, host commands, settings page navigation, composer accessories, editable context and native submission receipts. The live-tested candidate interfaces are included in Loader 0.5.11; update Loader first. Check diagnostics; Bridge does not upgrade Loader. See docs/RELEASE-0.1.1.md and docs/USAGE.md in the repository. Local modifications or new permissions may require update confirmation.'
          gh release create $env:RELEASE_TAG "dist/bridge-$version.zip" "dist/bridge-$version.zip.sha256" --verify-tag --draft --title "Bridge $version" --notes $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false --latest
